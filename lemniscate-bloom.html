<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Lemniscate Bloom</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #050505;
      color: #f5f5f5;
      font-family: Inter, system-ui, sans-serif;
    }
    .demo {
      display: grid;
      gap: 20px;
      justify-items: center;
      padding: 32px;
    }
    .frame {
      width: min(72vmin, 420px);
      aspect-ratio: 1;
      display: grid;
      place-items: center;
    }
    svg {
      width: 100%;
      height: 100%;
      overflow: visible;
    }
    .meta {
      display: grid;
      gap: 6px;
      text-align: center;
    }
    .title {
      font-size: 22px;
      font-weight: 700;
    }
    .tag {
      font-size: 13px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.58);
    }
    .formula {
      max-width: min(92vw, 720px);
      padding: 14px 16px;
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 14px;
      background: rgba(255,255,255,0.03);
      color: rgba(255,255,255,0.82);
      font: 13px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace;
      white-space: pre-wrap;
    }
    .back-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 10px 16px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.14);
      background: rgba(255,255,255,0.04);
      color: #fff;
      text-decoration: none;
      font-size: 13px;
      line-height: 1;
      transition: background 180ms ease, border-color 180ms ease, transform 180ms ease;
    }
    .back-link:hover {
      background: rgba(255,255,255,0.08);
      border-color: rgba(255,255,255,0.22);
      transform: translateY(-1px);
    }
  </style>
</head>
<body>
  <div class="demo">
    <div class="frame">
      <svg viewBox="0 0 100 100" fill="none" aria-hidden="true">
        <g id="group">
          <path id="path" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" opacity="0.8" stroke-width="1.5"></path>
        </g>
      </svg>
    </div>
    <div class="meta">
      <div class="title">Lemniscate Bloom</div>
      <div class="tag">Bernoulli Lemniscate</div>
    </div>
    <pre class="formula" id="formula"></pre>
    <a class="back-link" href="https://paidax01.github.io/math-curve-loaders/" target="_blank" rel="noreferrer">View All</a>
  </div>
  <script>
    const SVG_NS = 'http://www.w3.org/2000/svg';
    const config = {
      name: "Lemniscate Bloom",
      tag: "Bernoulli Lemniscate",
      rotate: false,
      particleCount: 70,
      trailSpan: 0.4,
      durationMs: 5600,
      rotationDurationMs: 34000,
      pulseDurationMs: 5000,
      strokeWidth: 1.5,
      lemniscateA: 20,
      lemniscateBoost: 7,
      formula(config) {
        return [
          `a = ${config.lemniscateA.toFixed(1)} + ${config.lemniscateBoost.toFixed(1)}s`,
          "x(t) = 50 + a cos t / (1 + sin² t)",
          "y(t) = 50 + a sin t cos t / (1 + sin² t)",
        ].join("\n");
      },
      point(progress, detailScale, config) {
        const t = progress * Math.PI * 2;
        const scale = (config.lemniscateA + detailScale * config.lemniscateBoost) / 30;
        const denom = 1 + Math.sin(t) ** 2;
        const x = Math.cos(t) / denom;
        const y = Math.sin(t) * Math.cos(t) / denom;
        return {
          x: 50 + x * scale * 15,
          y: 50 + y * scale * 15,
        };
      },
    };

    const group = document.querySelector('#group');
    const path = document.querySelector('#path');
    const formula = document.querySelector('#formula');
    
    formula.textContent = typeof config.formula === 'function' ? config.formula(config) : config.formula;
    
    const particles = Array.from({ length: config.particleCount }, () => {
      const circle = document.createElementNS(SVG_NS, 'circle');
      circle.setAttribute('fill', 'currentColor');
      group.appendChild(circle);
      return circle;
    });

    function normalizeProgress(progress) {
      return ((progress % 1) + 1) % 1;
    }

    function getDetailScale(time) {
      const pulseProgress = (time % config.pulseDurationMs) / config.pulseDurationMs;
      const pulseAngle = pulseProgress * Math.PI * 2;
      return 0.52 + ((Math.sin(pulseAngle + 0.55) + 1) / 2) * 0.48;
    }

    function getRotation(time) {
      if (!config.rotate) return 0;
      return -((time % config.rotationDurationMs) / config.rotationDurationMs) * 360;
    }

    function buildPath(detailScale, steps = 480) {
      return Array.from({ length: steps + 1 }, (_, index) => {
        const point = config.point(index / steps, detailScale, config);
        return `${index === 0 ? 'M' : 'L'} ${point.x.toFixed(2)} ${point.y.toFixed(2)}`;
      }).join(' ');
    }

    function getParticle(index, progress, detailScale) {
      const tailOffset = index / (config.particleCount - 1);
      const point = config.point(normalizeProgress(progress - tailOffset * config.trailSpan), detailScale, config);
      const fade = Math.pow(1 - tailOffset, 0.56);
      return {
        x: point.x,
        y: point.y,
        radius: 0.9 + fade * 2.7,
        opacity: 0.04 + fade * 0.96,
      };
    }

    const startedAt = performance.now();
    function render(now) {
      const time = now - startedAt;
      const progress = (time % config.durationMs) / config.durationMs;
      const detailScale = getDetailScale(time);
      group.setAttribute('transform', `rotate(${getRotation(time)} 50 50)`);
      path.setAttribute('d', buildPath(detailScale));
      particles.forEach((node, index) => {
        const particle = getParticle(index, progress, detailScale);
        node.setAttribute('cx', particle.x.toFixed(2));
        node.setAttribute('cy', particle.y.toFixed(2));
        node.setAttribute('r', particle.radius.toFixed(2));
        node.setAttribute('opacity', particle.opacity.toFixed(3));
      });
      requestAnimationFrame(render);
    }
    requestAnimationFrame(render);
  </script>
</body>
</html>
